<!-- jinja code : django expersion -->
{% extends 'header.html' %}
{% block content %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>

<body>

    <h1>Welcome to Forget Password</h1>
    <!-- post secure method submit data -->
     {% if msg %}
     <b style="color: blue;" >{{msg}}</b>
    {% endif %}
    <form method="post" action="{% url 'forget-password' %}">
        {%  csrf_token %}
        <table>
           
            <tr>
                <td>Email </td>
                <td><input type="email" name="email"></td>
            </tr>
            <tr>
                <td >
                    <input class="btn btn-primary" type="submit" value="Send OTP">
                </td>
            </tr>
        </table>
    </form>
</body>


</html>
{% endblock %}
