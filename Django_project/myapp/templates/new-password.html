<!-- jinja code : django expersion -->
{% extends 'header.html' %}
{% block content %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>

<body>

    <h1>Welcome to Update Password</h1>
    <!-- post secure method submit data -->
     {% if msg %}
     <b style="color: blue;" >{{msg}}</b>
    {% endif %}
    <form method="post" action="{% url 'new-password' %}">
        {%  csrf_token %}
        <table>
              <tr>
                <td>New Password</td>
                <td><input type="password" name="new_password"></td>
            </tr>
              <tr>
                <td>Confirm New Password</td>
                <td><input type="password" name="cnew_password"></td>
            </tr>
            <tr>
                <td colspan="2">
                    <input class="btn btn-primary" type="submit" value="Update Password">
                </td>
            </tr>
        </table>
    </form>
</body>


</html>
{% endblock %}
